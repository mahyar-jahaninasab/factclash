[project]
name = "factclash"
version = "0.1.0"
description = "Classifying contradictory context that can increase hallucination and resolving them"
readme = "README.md"
authors = [
    { email = "jahaninasab.mahyar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.1",
    "spacy>=3.8.18",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "async-lru>=2.4.0",
]

[project.scripts]
factclash = "factclash:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.1",
]
